name: Build and Deploy Aervalon Web

on:
  push:
    branches: [main, visual-rebuild-v2]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build_dir: ${{ steps.version.outputs.build_dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Godot and Web templates
        shell: bash
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          unzip -j -q /tmp/templates.tpz 'templates/web*' 'templates/version.txt' -d "$HOME/.local/share/godot/export_templates/4.5.1.stable"

      - name: Import, test gameplay and export
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --import 2>&1 | tee /tmp/import.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' /tmp/import.log; then exit 1; fi
          godot --headless --path . --script tests/slice_test.gd -- --test 2>&1 | tee /tmp/tests.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' /tmp/tests.log; then exit 1; fi
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html 2>&1 | tee /tmp/export.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' /tmp/export.log; then exit 1; fi

      - name: Install browser test dependencies
        run: |
          npm install --prefix tests/browser
          cd tests/browser
          npx playwright install --with-deps chromium

      - name: Verify WebGL build and mobile controls
        run: node tests/browser/smoke.cjs

      - name: Save browser verification captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aervalon-browser-qa
          path: qa/

      - name: Save tested Web build
        uses: actions/upload-artifact@v4
        with:
          name: aervalon-web-${{ github.sha }}
          path: build/web/
          retention-days: 14

      - name: Preserve existing published builds
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '[.artifacts[] | select(.workflow_run.head_branch == "main" and (.name | startswith("github-pages")) and .expired == false)] | sort_by(.created_at) | last | .id')
          test -n "$ARTIFACT" && test "$ARTIFACT" != null
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT/zip" > /tmp/prior-pages.zip
          mkdir -p public /tmp/prior-pages
          unzip -q /tmp/prior-pages.zip -d /tmp/prior-pages
          tar -xf /tmp/prior-pages/artifact.tar -C public
          test -f public/index.html

      - name: Create immutable build path
        id: version
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          BUILD_DIR="build-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          echo "build_dir=$BUILD_DIR" >> "$GITHUB_OUTPUT"
          mkdir -p "public/$BUILD_DIR"
          cp -r "build/web/." "public/$BUILD_DIR/"
          touch "public/$BUILD_DIR/.nojekyll"
          test -f "public/$BUILD_DIR/index.html"
          test -f "public/$BUILD_DIR/index.pck"
          test -f "public/$BUILD_DIR/index.wasm"
          PCK_SIZE=$(stat -c%s "public/$BUILD_DIR/index.pck")
          echo "Published immutable build: $BUILD_DIR (PCK $PCK_SIZE bytes)"

          cat > public/index.html <<EOF
          <!doctype html>
          <html><head>
          <meta charset="utf-8">
          <meta http-equiv="cache-control" content="no-store, no-cache, must-revalidate">
          <meta http-equiv="pragma" content="no-cache">
          <meta http-equiv="expires" content="0">
          <meta http-equiv="refresh" content="0; url=./$BUILD_DIR/">
          <title>Aervalon</title>
          </head><body>
          <p>Loading Aervalon...</p>
          <script>location.replace("./$BUILD_DIR/");</script>
          </body></html>
          EOF
          touch public/.nojekyll

      # Build the current visual-rebuild-v2 branch into a separate preview path.
      # The root URL continues to point at the immutable main build above.
      - name: Checkout V2 preview
        uses: actions/checkout@v4
        with:
          ref: visual-rebuild-v2
          path: preview-src

      - name: Export V2 preview
        uses: firebelley/godot-export@v6.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz
          relative_project_path: ./preview-src/
          archive_output: false

      - name: Publish V2 preview path
        shell: bash
        run: |
          set -euo pipefail
          PREVIEW_SHA=$(git -C preview-src rev-parse --short=8 HEAD)
          PREVIEW_DIR="build-$PREVIEW_SHA"
          if [ ! -d "public/preview-v2/$PREVIEW_DIR" ]; then
            mkdir -p "public/preview-v2/$PREVIEW_DIR"
            cp -r "$HOME/.local/share/godot/builds/Web/." "public/preview-v2/$PREVIEW_DIR/"
          fi
          touch public/preview-v2/.nojekyll
          test -f "public/preview-v2/$PREVIEW_DIR/index.html"
          test -f "public/preview-v2/$PREVIEW_DIR/index.pck"
          test -f "public/preview-v2/$PREVIEW_DIR/index.wasm"
          cat > public/preview-v2/index.html <<EOF
          <!doctype html><html><head><meta charset="utf-8">
          <meta http-equiv="cache-control" content="no-store">
          <meta http-equiv="refresh" content="0;url=./$PREVIEW_DIR/">
          <title>Aervalon — Eryndor</title></head><body>
          <a href="./$PREVIEW_DIR/">Jogar Aervalon</a>
          <script>location.replace("./$PREVIEW_DIR/"+location.search);</script>
          </body></html>
          EOF
          echo "V2 preview staged at /preview-v2/$PREVIEW_DIR/"


      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy immutable build to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
