name: Build, test and publish Eryndor preview

on:
  push:
    branches: [main, visual-rebuild-v2]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build_dir: ${{ steps.version.outputs.build_dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Godot and Web templates
        shell: bash
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          unzip -j -q /tmp/templates.tpz 'templates/web*' 'templates/version.txt' -d "$HOME/.local/share/godot/export_templates/4.5.1.stable"

      - name: Import, test gameplay and export
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --import 2>&1 | tee /tmp/import.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' /tmp/import.log; then exit 1; fi
          godot --headless --path . --script tests/slice_test.gd -- --test 2>&1 | tee /tmp/tests.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' /tmp/tests.log; then exit 1; fi
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html 2>&1 | tee /tmp/export.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' /tmp/export.log; then exit 1; fi

      - name: Install browser test dependencies
        run: |
          npm install --prefix tests/browser
          cd tests/browser
          npx playwright install --with-deps chromium

      - name: Verify WebGL build and mobile controls
        run: node tests/browser/smoke.cjs

      - name: Save browser verification captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aervalon-browser-qa
          path: qa/

      - name: Preserve published stable build and add immutable preview
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Only restore successfully deployed main releases or this preview workflow.
          RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=success&per_page=50" --jq '.workflow_runs | map(select(.head_branch == "main" or .name == "Build, test and publish Eryndor preview")) | .[0].id')
          test -n "$RUN" && test "$RUN" != null
          ARTIFACT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/artifacts" --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id')
          test -n "$ARTIFACT"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT/zip" > /tmp/published.zip
          mkdir -p public /tmp/published
          unzip -q /tmp/published.zip -d /tmp/published
          tar -xf /tmp/published/artifact.tar -C public
          test -f public/index.html
          sha256sum public/index.html > /tmp/stable-root.sha
          BUILD_DIR="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::8}"
          echo "build_dir=$BUILD_DIR" >> "$GITHUB_OUTPUT"
          mkdir -p "public/preview-v2/$BUILD_DIR"
          cp -r build/web/. "public/preview-v2/$BUILD_DIR/"
          cat > public/preview-v2/index.html <<EOF
          <!doctype html><html><head><meta charset="utf-8">
          <meta http-equiv="cache-control" content="no-store">
          <meta http-equiv="refresh" content="0;url=./$BUILD_DIR/">
          <title>Aervalon — Eryndor</title></head><body>
          <a href="./$BUILD_DIR/">Jogar Aervalon</a>
          <script>location.replace("./$BUILD_DIR/"+location.search);</script>
          </body></html>
          EOF
          touch public/.nojekyll
          test -f "public/preview-v2/$BUILD_DIR/index.pck"
          test -f "public/preview-v2/$BUILD_DIR/index.wasm"
          sha256sum -c /tmp/stable-root.sha

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy immutable build to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
